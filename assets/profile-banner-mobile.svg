<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
  <title id="title">YJHTRY — from interfaces to systems</title>
  <desc id="desc">A compact dark technical map connecting interfaces, tools, runtimes, and systems.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020" />
      <stop offset="0.52" stop-color="#111936" />
      <stop offset="1" stop-color="#17102c" />
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#41b883" />
      <stop offset="0.38" stop-color="#3178c6" />
      <stop offset="0.7" stop-color="#dea584" />
      <stop offset="1" stop-color="#a277ff" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7c8cff" stop-opacity="0.24" />
      <stop offset="1" stop-color="#7c8cff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="720" height="400" rx="28" fill="url(#background)" />
  <circle cx="620" cy="60" r="190" fill="url(#glow)" />
  <circle cx="80" cy="390" r="170" fill="url(#glow)" opacity="0.7" />

  <g fill="none" stroke="#8ca0c8" stroke-opacity="0.13">
    <path d="M0 80H720M0 160H720M0 240H720M0 320H720" />
    <path d="M120 0V400M240 0V400M360 0V400M480 0V400M600 0V400" />
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" text-anchor="middle">
    <text x="360" y="132" fill="#ffffff" font-size="76" font-weight="700" letter-spacing="7">YJHTRY</text>
    <text x="360" y="180" fill="#a9b6d3" font-size="24" letter-spacing="1.5">FROM INTERFACES TO SYSTEMS</text>
  </g>

  <g fill="none" stroke="url(#signal)" stroke-width="4" stroke-linecap="round">
    <path d="M128 292H592" />
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="20" font-weight="600" text-anchor="middle">
    <circle cx="128" cy="292" r="10" fill="#41b883" />
    <circle cx="282" cy="292" r="10" fill="#3178c6" />
    <circle cx="438" cy="292" r="10" fill="#a277ff" />
    <circle cx="592" cy="292" r="10" fill="#dea584" />
    <text x="128" y="334" fill="#c8d3ea">UI</text>
    <text x="282" y="334" fill="#c8d3ea">TOOLS</text>
    <text x="438" y="334" fill="#c8d3ea">RUNTIME</text>
    <text x="592" y="334" fill="#c8d3ea">SYSTEMS</text>
  </g>

  <rect x="1.5" y="1.5" width="717" height="397" rx="26.5" fill="none" stroke="url(#signal)" stroke-opacity="0.45" stroke-width="3" />
</svg>
